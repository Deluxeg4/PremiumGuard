jar {
    manifest {
        attributes 'Automatic-Module-Name': 'dev.cads.premiumguard.core'
    }
}

// Resource filtering
processResources {
    // Certificate should not be filtered
    filesMatching('yggdrasil_session_pubkey.der') {
        it.filteringCharset = null
    }
    
    // Filter other resources
    filesMatching('**/*.yml') {
        filter { String line ->
            line
                .replace('${project.name}', rootProject.name)
                .replace('${project.version}', project.version)
                .replace('${project.description}', 'PremiumGuard - Blocks cracked players from using premium account names')
                .replace('${project.url}', 'https://github.com/cads/premiumguard')
        }
    }
}

dependencies {
    // Database pooling
    implementation('com.zaxxer:HikariCP:4.0.3') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    
    // Logging framework (SLF4J implementation)
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'
    
    // BungeeCord config (for YAML)
    implementation 'net.md-5:bungeecord-config:1.20-R0.2'
    
    // SnakeYAML
    implementation 'org.yaml:snakeyaml:2.4'
    
    // Floodgate API (Bedrock/Xbox Live auth)
    compileOnly('org.geysermc.floodgate:api:2.2.3-SNAPSHOT') {
        transitive = false
    }
    
    // Geyser core (Bedrock player bridge)
    compileOnly('org.geysermc.geyser:core:2.2.1-SNAPSHOT') {
        transitive = false
    }
    
    // Geyser API
    compileOnly('org.geysermc.geyser:api:2.2.1-SNAPSHOT') {
        transitive = false
    }
    
    // CraftAPI (Mojang API client)
    implementation 'com.github.games647:craftapi:1.0-SNAPSHOT'
    
    // SQLite JDBC (provided by Spigot/Bungee)
    compileOnly 'org.xerial:sqlite-jdbc:3.36.0.3'
}

// Skip tests for now (JUnit 5 requires Java 17+, but main code is Java 8)
test {
    enabled = false
}

// Publish configuration
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'codemc'
            url = version.endsWith('SNAPSHOT') ? 
                'https://repo.codemc.io/repository/maven-snapshots/' :
                'https://repo.codemc.io/repository/maven-releases/'
            credentials {
                username = findProperty('deployUser') ?: ''
                password = findProperty('deployPassword') ?: ''
            }
        }
    }
}
